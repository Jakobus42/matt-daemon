name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} ${{matrix.build_type}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc-14, llvm-19]
        build_type: [release, debug, asan, tsan, analyze]
    steps:
      - uses: actions/checkout@v4

      - name: Cache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.compiler }}-${{ runner.build_type }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: ${{ runner.os }}-${{ runner.compiler }}-${{ runner.build_type }}

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          cmake: true
          ninja: true
          ccache: true
          clangtidy: 19.1.1

      - name: Configure CMake
        run: cmake --preset ${matrix.build_type}

      - name: Build
        run: cmake --build --preset ${matrix.build_type}

      - name: Test
        run: ctest -C ${{matrix.build_type}}
