name: Docs
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy-doxygen-docs
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jakobus42/clang-p2996-dev:latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          apt-get update 
          apt-get install -y doxygen graphviz

      - name: Configure
        run: cmake -B build -DMATT_DAEMON_ENABLE_DOXYGEN=ON

      - name: Build Docs
        run: cmake --build build --target doxygen-docs

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

      - name: Deploy
        uses: actions/deploy-pages@v4
